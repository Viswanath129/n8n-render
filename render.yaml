services:
  - type: worker
    name: n8n-worker
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: N8N_ENCRYPTION_KEY
        value: supersecretkey123
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: admin123
